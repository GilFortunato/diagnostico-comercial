name: Patch authority UI copy

on:
  push:
    branches:
      - codex/gemini-free-provider-cleanup
    paths:
      - .github/workflows/patch-authority-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/gemini-free-provider-cleanup
      - name: Update content workflow copy
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/diagnostics/AuthorityDiagnostic.tsx')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'Nada será publicado sem sua aprovação.': 'A Share AI gera o conteúdo; a publicação no LinkedIn é feita por você.',
              'Cada conclusão separa dados encontrados no perfil, informações declaradas, contexto da BU e inferências da IA. Nenhuma ação externa é executada sem aprovação.': 'Cada conclusão separa dados encontrados no perfil, informações declaradas, contexto da BU e inferências da IA. Conteúdos e abordagens são entregues como rascunhos para você usar quando fizer sentido.',
              '"Criar rascunho"': '"Analisar e criar conteúdo"',
              '"Construindo estratégia e texto..."': '"Interpretando contexto e construindo conteúdo..."',
          }
          for before, after in replacements.items():
              if before not in text:
                  print(f'WARNING: trecho não encontrado: {before[:80]}')
              text = text.replace(before, after)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "Share AI automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/diagnostics/AuthorityDiagnostic.tsx
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "Align content UI with draft-only workflow"
          git push origin HEAD:codex/gemini-free-provider-cleanup
