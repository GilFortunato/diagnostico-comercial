name: Debug LinkedIn V2 Typecheck

on:
  pull_request:
    branches:
      - codex/share-ai-mvp-foundation

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - name: Capture typecheck
        id: typecheck
        shell: bash
        run: |
          set +e
          pnpm typecheck > typecheck.log 2>&1
          CODE=$?
          cat typecheck.log
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Comment typecheck errors
        if: steps.typecheck.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = fs.readFileSync('typecheck.log', 'utf8');
            if (body.length > 60000) body = body.slice(0, 60000) + '\n…truncado';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### Typecheck LinkedIn V2\n\n\`\`\`text\n${body}\n\`\`\``
            });
